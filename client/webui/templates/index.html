<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WS2812 / Soft Control Desk</title>
  <style>
    :root {
      --paper: #07131b;
      --paper-deep: #0b202a;
      --panel: rgba(12, 29, 39, 0.9);
      --ink: #e6f0eb;
      --ink-muted: #9bb0b0;
      --line: rgba(169, 203, 195, 0.18);
      --teal: #8dc9bc;
      --teal-deep: #5b9f99;
      --coral: #e3a08b;
      --amber: #d6b277;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      --radius-large: 24px;
      --radius-small: 12px;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      background-image: linear-gradient(rgba(4, 12, 18, 0.54), rgba(4, 12, 18, 0.76)), url("../assets/background.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app-shell {
      width: min(1480px, calc(100% - 48px));
      margin: 0 auto;
      padding: 30px 0 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 4px 4px 24px;
    }

    .topbar-actions { display: flex; align-items: center; gap: 8px; }

    .connection-status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      padding: 10px 13px;
      color: var(--ink-muted);
      background: rgba(7, 25, 34, 0.82);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 5px rgba(214, 178, 119, 0.12);
    }

    .connection-status[data-state="online"] .status-dot { background: var(--teal); box-shadow: 0 0 0 5px rgba(141, 201, 188, 0.12); }
    .connection-status[data-state="offline"], .connection-status[data-state="error"] { border-color: rgba(227, 160, 139, 0.4); }
    .connection-status[data-state="offline"] .status-dot, .connection-status[data-state="error"] .status-dot { background: var(--coral); box-shadow: 0 0 0 5px rgba(227, 160, 139, 0.12); }
    .status-copy { display: grid; gap: 2px; min-width: 70px; }
    .status-state { color: var(--ink); font-size: 12px; font-weight: 750; }
    .status-age, .status-message { color: var(--ink-muted); font-size: 10px; }
    .status-message { margin-left: auto; text-align: right; }
    .maintenance-button.tool-button { min-height: 0; padding: 9px 13px; color: var(--ink-muted); background: rgba(19, 43, 53, 0.78); border: 1px solid rgba(227, 160, 139, 0.36); border-radius: 10px; cursor: pointer; font-size: 12px; transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease; }
    .maintenance-button.tool-button:hover { color: var(--coral); background: rgba(38, 61, 67, 0.9); border-color: var(--coral); transform: translateY(-1px); }
    .maintenance-button.tool-button:active { color: #07131b; background: var(--coral); border-color: var(--coral); transform: none; }
    .maintenance-button:disabled { opacity: 0.58; cursor: default; transform: none; }
    .maintenance-button:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    .device-actions { display: flex; align-items: center; gap: 6px; }

    body.modal-open { overflow: hidden; }
    .modal-layer { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 24px; background: rgba(3, 13, 19, 0.62); backdrop-filter: blur(10px); }
    .modal-layer[hidden] { display: none; }
    .modal-backdrop { position: absolute; inset: 0; }
    .modal-dialog { position: relative; width: min(440px, 100%); padding: 24px; color: var(--ink); background: linear-gradient(145deg, rgba(12, 35, 45, 0.98), rgba(7, 23, 31, 0.98)); border: 1px solid var(--line); border-radius: 20px 8px 20px 20px; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42); }
    .modal-dialog[data-variant="danger"] { border-color: rgba(227, 160, 139, 0.55); }
    .modal-eyebrow { margin-bottom: 8px; color: var(--teal); font-size: 10px; font-weight: 750; letter-spacing: 0.14em; text-transform: uppercase; }
    .modal-title { margin: 0; color: var(--ink); font-size: 20px; letter-spacing: -0.03em; }
    .modal-message { margin: 10px 0 0; color: var(--ink-muted); font-size: 12px; line-height: 1.7; white-space: pre-wrap; }
    .modal-input-wrap { display: grid; gap: 7px; margin-top: 18px; color: var(--ink-muted); font-size: 11px; }
    .modal-input-wrap[hidden] { display: none; }
    .modal-input { width: 100%; min-height: 40px; padding: 9px 11px; color: var(--ink); background: rgba(4, 16, 23, 0.72); border: 1px solid var(--line); border-radius: 10px; outline: none; }
    .modal-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(141, 201, 188, 0.12); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    .modal-actions .tool-button { min-width: 78px; }
    .modal-confirm.danger { color: #07131b; background: var(--coral); border-color: var(--coral); }
    .modal-confirm.danger:hover { color: #07131b; background: #efb09c; border-color: #efb09c; }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      color: #07131b;
      background: var(--teal);
      border-radius: 13px 13px 13px 4px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -1px;
      box-shadow: 4px 5px 0 rgba(0, 0, 0, 0.2);
    }

    .brand-kicker {
      margin-bottom: 3px;
      color: var(--teal);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
      margin-top: 16px;
    }

    .matrix-panel, .control-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .matrix-panel { display: flex; flex-direction: column; }

    .matrix-panel {
      min-width: 0;
      padding: 24px;
      border-radius: 8px var(--radius-large) var(--radius-large) var(--radius-large);
    }

    .control-panel {
      padding: 22px;
      border-radius: var(--radius-large) 8px var(--radius-large) var(--radius-large);
    }

    .panel-heading {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    .panel-heading h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .panel-heading p {
      margin: 5px 0 0;
      color: var(--ink-muted);
      font-size: 12px;
    }

    .matrix-meta {
      color: var(--teal-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .matrix-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .matrix-paint-picker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      margin-left: auto;
      padding: 5px 9px 5px 12px;
      color: var(--ink-muted);
      background: rgba(19, 43, 53, 0.78);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 11px;
      white-space: nowrap;
    }

    .matrix-paint-picker input {
      width: 30px;
      height: 26px;
      padding: 2px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
    }

    .tool-button, .mode-button {
      border: 1px solid var(--line);
      background: rgba(19, 43, 53, 0.78);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .tool-button {
      padding: 9px 13px;
      border-radius: 10px;
      color: var(--ink-muted);
      font-size: 12px;
    }

    .tool-button.primary {
      color: #07131b;
      background: var(--teal-deep);
      border-color: var(--teal-deep);
    }

    .tool-button:hover, .mode-button:hover {
      border-color: var(--teal);
      color: var(--teal-deep);
      transform: translateY(-1px);
    }

    .tool-button.primary:hover {
      color: #fff;
      background: var(--teal);
    }

    .matrix-viewport {
      padding: 18px 16px;
      overflow-x: auto;
      background: rgba(4, 16, 23, 0.74);
      border: 1px solid var(--line);
      border-radius: 16px;
      scrollbar-color: var(--teal) transparent;
    }

    .matrix-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: max-content;
      min-width: 100%;
    }

    .pixel-row {
      display: flex;
      gap: 3px;
    }

    .pixel {
      flex: 0 0 9px;
      width: 9px;
      height: 9px;
      background: #17323d;
      border: 1px solid rgba(169, 203, 195, 0.12);
      border-radius: 3px;
      cursor: crosshair;
      transition: transform 100ms ease, background-color 100ms ease;
    }

    .pixel:hover {
      transform: scale(1.55);
      border-color: var(--teal-deep);
    }

    .matrix-footnote {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      margin-top: 13px;
      color: var(--ink-muted);
      font-size: 11px;
    }

    .shape-panel { display: flex; flex: 1; min-height: 0; flex-direction: column; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
    .shape-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .shape-heading h3 { margin: 0; font-size: 14px; }
    .shape-heading p { margin: 4px 0 0; color: var(--ink-muted); font-size: 11px; }
    .shape-actions { display: flex; gap: 8px; align-items: center; }
    #shapeName { width: 130px; min-height: 32px; padding: 6px 9px; color: var(--ink); background: rgba(19, 43, 53, 0.78); border: 1px solid var(--line); border-radius: 8px; font-size: 11px; }
    #saveShape { min-height: 32px; padding: 6px 10px; }
    .shape-list { display: grid; flex: 1; min-height: 0; grid-template-columns: repeat(3, minmax(0, 1fr)); align-content: start; gap: 8px; overflow-y: scroll; padding: 2px 4px 4px 0; scrollbar-color: var(--teal) transparent; }
    .shape-card { display: grid; gap: 7px; padding: 9px; background: rgba(19, 43, 53, 0.62); border: 1px solid var(--line); border-radius: 12px; }
    .shape-card-body { display: grid; gap: 5px; align-content: start; }
    .shape-card-body strong { color: var(--ink); font-size: 11px; line-height: 1.2; }
    .shape-kind { color: var(--teal-deep); font-size: 9px; }
    .shape-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .shape-card-name { overflow: hidden; color: var(--ink); font-size: 11px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .shape-card-kind { color: var(--teal-deep); font-size: 9px; }
    .shape-preview { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); aspect-ratio: 4 / 1; gap: 2px; padding: 6px; background: var(--paper-deep); border-radius: 8px; }
    .shape-preview-cell { width: 100%; height: 100%; min-width: 0; min-height: 0; background: #17323d; border-radius: 2px; }
    .shape-preview-cell.lit { background: var(--teal); }
    .shape-card-actions { display: flex; flex-wrap: wrap; gap: 5px; }
    .shape-card-actions button { min-height: 25px; padding: 4px 7px; color: var(--ink-muted); background: transparent; border: 1px solid var(--line); border-radius: 7px; cursor: pointer; font-size: 10px; }
    .shape-card-actions button:hover, .shape-card-actions button:active { color: #07131b; background: var(--teal); border-color: var(--teal); }

    .control-section + .control-section {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 650;
    }

    .value-display { color: var(--teal-deep); }

    .color-row {
      display: grid;
      grid-template-columns: 1fr 52px;
      gap: 10px;
      align-items: center;
    }

    .palette-list {
      display: grid;
      height: 184px;
      gap: 8px;
      align-content: start;
      overflow-y: scroll;
      padding: 8px 6px 8px 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      scrollbar-color: var(--teal) transparent;
    }

    .palette-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .palette-row.removable {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .palette-color {
      display: block;
      min-width: 0;
      width: 100%;
      height: 38px;
      padding: 4px;
      background: rgba(19, 43, 53, 0.78);
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
    }

    .palette-remove, .palette-add {
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink-muted);
      background: rgba(19, 43, 53, 0.78);
      cursor: pointer;
      font-size: 11px;
    }

    .palette-remove {
      width: 34px;
      height: 34px;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .palette-add {
      width: 100%;
      margin-top: 9px;
      padding: 8px;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .tool-button:hover, .palette-remove:hover, .palette-add:hover {
      color: var(--teal-deep);
      border-color: var(--teal);
      transform: translateY(-1px);
    }

    .tool-button:active, .palette-remove:active, .palette-add:active {
      color: #07131b;
      background: var(--teal);
      border-color: var(--teal);
      transform: translateY(0);
    }

    .color-swatch {
      width: 100%;
      height: 42px;
      padding: 4px;
      background: rgba(19, 43, 53, 0.78);
      border: 1px solid var(--line);
      border-radius: 11px;
      cursor: pointer;
    }

    .color-code {
      color: var(--ink-muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      margin: 7px 0 2px;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .mode-button {
      min-height: 44px;
      padding: 8px 7px;
      border-radius: 11px;
      color: var(--ink-muted);
      font-size: 12px;
      text-align: left;
    }

    .mode-button.active {
      color: var(--teal-deep);
      background: rgba(99, 169, 158, 0.2);
      border-color: rgba(141, 201, 188, 0.62);
      box-shadow: inset 3px 0 0 var(--teal);
    }

    :focus-visible {
      outline: 3px solid rgba(227, 160, 139, 0.62);
      outline-offset: 3px;
    }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .control-panel { border-radius: 8px var(--radius-large) var(--radius-large) var(--radius-large); }
      .connection-status { min-width: 0; }
      .shape-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .app-shell { width: min(100% - 24px, 1480px); padding-top: 14px; }
      .topbar { align-items: flex-start; flex-direction: column; padding-bottom: 16px; }
      .topbar-actions { width: 100%; align-items: stretch; flex-direction: column; }
      .connection-status { width: 100%; }
      .device-actions { width: 100%; }
      .device-actions .tool-button, .maintenance-button { flex: 1; }
      .maintenance-button { width: 100%; }
      .shape-heading { align-items: flex-start; flex-direction: column; }
      .shape-actions { width: 100%; }
      #shapeName { flex: 1; width: auto; }
      .shape-list { grid-template-columns: 1fr; }
      .matrix-panel, .control-panel { padding: 17px; }
      .matrix-footnote { display: block; line-height: 1.6; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">LD</div>
      <div>
        <div class="brand-kicker">AETHERIA DESKTOP/CLOUD LED</div>
        <div class="brand-name">WS2812 控制台</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="connection-status" id="connectionStatus" data-state="connecting" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-copy"><span class="status-state" id="connectionState">连接中</span><span class="status-age" id="heartbeatAge">尚未收到心跳</span></span>
        <span class="status-message" id="statusMessage">正在连接设备</span>
      </div>
      <div class="device-actions">
        <button class="tool-button" id="restartButton" type="button">重启设备</button>
        <button class="tool-button" id="resetStateButton" type="button">重置设备</button>
        <button class="tool-button maintenance-button" id="maintenanceButton" type="button">进入维护模式</button>
      </div>
    </div>
  </header>

    <section class="workspace">
      <section class="matrix-panel">
        <div class="panel-heading">
          <div>
            <h2>点阵编辑区</h2>
            <p>点击或拖动，为每一颗灯选择颜色</p>
          </div>
          <div class="matrix-meta">MATRIX / 0864 DOTS</div>
        </div>
        <div class="matrix-toolbar">
          <button class="tool-button" id="clearMatrix" type="button">清空画布</button>
          <button class="tool-button" id="invertMatrix" type="button">反转颜色</button>
          <button class="tool-button primary" id="sendMatrix" type="button">发送矩阵</button>
          <label class="matrix-paint-picker" title="仅改变矩阵画笔颜色"><span>画笔颜色</span><input id="paintColorPicker" type="color" value="#8dc9bc" aria-label="矩阵画笔颜色" /></label>
        </div>
        <div class="matrix-viewport"><div class="matrix-container" id="matrixContainer"></div></div>
        <div class="matrix-footnote"><span id="matrixState">画布就绪</span></div>
        <section class="shape-panel" aria-labelledby="shapePanelTitle">
          <div class="shape-heading"><div><h3 id="shapePanelTitle">矩阵形状</h3><p>预设不可修改；自定义形状可保存和管理</p></div><div class="shape-actions"><input id="shapeName" type="text" maxlength="40" placeholder="形状名称" aria-label="形状名称" /><button class="tool-button" id="saveShape" type="button">保存当前矩阵</button></div></div>
          <div class="shape-list" id="shapeList"></div>
        </section>
      </section>

      <aside class="control-panel">
        <div class="panel-heading">
          <div><h2>光线参数</h2><p>调整当前效果的基准状态</p></div>
        </div>
        <div class="control-section">
          <div class="control-label"><span>快捷颜色</span><span class="color-code">渐变 / 单色</span></div>
          <div class="palette-list" id="colorList"></div>
          <button class="palette-add" id="addColor" type="button">＋ 添加颜色</button>
        </div>
        <div class="control-section">
          <div class="control-label"><span>亮度</span><span class="value-display" id="brightValue">72%</span></div>
          <input id="brightness" type="range" min="0" max="100" value="72" />
        </div>
        <div class="control-section">
          <div class="control-label"><span>节奏</span><span class="value-display" id="speedValue">50</span></div>
          <input id="speed" type="range" min="10" max="200" value="50" />
        </div>
        <div class="control-section">
          <div class="control-label"><span>快捷效果</span><span class="value-display">3 presets</span></div>
          <div class="mode-grid">
            <button class="mode-button active" type="button">静态常亮</button>
            <button class="mode-button" type="button">呼吸渐变</button>
            <button class="mode-button" type="button">流光溢彩</button>
          </div>
        </div>
      </aside>
    </section>

    <div class="modal-layer" id="appModal" hidden>
      <div class="modal-backdrop" data-modal-backdrop></div>
      <section class="modal-dialog" data-variant="neutral" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage">
        <div class="modal-eyebrow" id="modalEyebrow">AETHERIA DESKTOP/CLOUD LED</div>
        <h2 class="modal-title" id="modalTitle">确认操作</h2>
        <p class="modal-message" id="modalMessage"></p>
        <label class="modal-input-wrap" id="modalInputWrap" hidden>
          <span id="modalInputLabel">名称</span>
          <input class="modal-input" id="modalInput" type="text" autocomplete="off" />
        </label>
        <div class="modal-actions">
          <button class="tool-button modal-cancel" id="modalCancelButton" type="button">取消</button>
          <button class="tool-button primary modal-confirm" id="modalConfirmButton" type="button">确认</button>
        </div>
      </section>
    </div>

  </main>

  <script>
    const COLUMNS = 144;
    const ROWS = 6;
    const paintColorPicker = document.getElementById("paintColorPicker");
    const matrixState = document.getElementById("matrixState");
    const matrixData = Array.from({ length: ROWS }, () => Array(COLUMNS).fill("#000000"));
    const paletteColors = ["#d88773"];
    const colorList = document.getElementById("colorList");
    let isDrawing = false;

    function renderColorList() {
      colorList.innerHTML = "";
      paletteColors.forEach((color, index) => {
        const row = document.createElement("div");
        row.className = "palette-row";

        const input = document.createElement("input");
        input.className = "palette-color";
        input.type = "color";
        input.value = color;
        input.dataset.index = index;
        input.setAttribute("aria-label", index === 0 ? "默认快捷颜色" : `快捷颜色 ${index + 1}`);
        input.addEventListener("input", event => {
          paletteColors[index] = event.target.value;
        });
        row.appendChild(input);

        if (index > 0) {
          row.classList.add("removable");
          const remove = document.createElement("button");
          remove.className = "palette-remove";
          remove.type = "button";
          remove.dataset.index = index;
          remove.textContent = "×";
          remove.setAttribute("aria-label", `删除快捷颜色 ${index + 1}`);
          remove.addEventListener("click", () => {
            paletteColors.splice(index, 1);
            renderColorList();
          });
          row.appendChild(remove);
        }

        colorList.appendChild(row);
      });
    }

    function renderMatrix() {
      const container = document.getElementById("matrixContainer");
      container.innerHTML = "";
      matrixData.forEach((row, rowIndex) => {
        const rowElement = document.createElement("div");
        rowElement.className = "pixel-row";
        row.forEach((value, columnIndex) => {
          const pixel = document.createElement("button");
          pixel.className = "pixel";
          pixel.type = "button";
          pixel.dataset.r = rowIndex;
          pixel.dataset.c = columnIndex;
          pixel.setAttribute("aria-label", `第 ${rowIndex + 1} 行，第 ${columnIndex + 1} 列`);
          pixel.style.backgroundColor = value === "#000000" ? "#17323d" : value;
          pixel.addEventListener("pointerdown", event => {
            event.preventDefault();
            isDrawing = true;
            paintPixel(pixel);
          });
          pixel.addEventListener("pointerenter", () => isDrawing && paintPixel(pixel));
          rowElement.appendChild(pixel);
        });
        container.appendChild(rowElement);
      });
    }

    function paintPixel(pixel) {
      const row = Number(pixel.dataset.r);
      const column = Number(pixel.dataset.c);
      matrixData[row][column] = paintColorPicker.value;
      pixel.style.backgroundColor = paintColorPicker.value;
      matrixState.textContent = `已编辑 · ${row + 1}:${column + 1}`;
    }

    function sendPreview() {
      const lit = matrixData.flat().filter(value => value !== "#000000").length;
      matrixState.textContent = `预览已发送 · ${lit} 颗灯点亮`;
    }

    document.addEventListener("pointerup", () => { isDrawing = false; });
    document.getElementById("clearMatrix").addEventListener("click", () => {
      matrixData.forEach(row => row.fill("#000000"));
      renderMatrix();
      matrixState.textContent = "画布已清空";
    });
    document.getElementById("invertMatrix").addEventListener("click", () => {
      matrixData.forEach(row => row.forEach((value, index, source) => {
        source[index] = value === "#000000" ? paintColorPicker.value : "#000000";
      }));
      renderMatrix();
      matrixState.textContent = "颜色已反转";
    });
    document.getElementById("sendMatrix").addEventListener("click", sendPreview);
    document.getElementById("addColor").addEventListener("click", () => {
      paletteColors.push("#8dc9bc");
      renderColorList();
    });
    document.getElementById("brightness").addEventListener("input", event => {
      document.getElementById("brightValue").textContent = `${event.target.value}%`;
    });
    document.getElementById("speed").addEventListener("input", event => {
      document.getElementById("speedValue").textContent = event.target.value;
    });
    function updateRhythmControl() {
      const speed = document.getElementById("speed");
      const value = document.getElementById("speedValue");
      value.textContent = speed.value;
    }
    document.querySelectorAll(".mode-button").forEach(button => button.addEventListener("click", () => {
      document.querySelectorAll(".mode-button").forEach(item => item.classList.remove("active"));
      button.classList.add("active");
      updateRhythmControl(button.textContent.trim());
      matrixState.textContent = `模式已切换 · ${button.textContent}`;
    }));

    renderColorList();
    renderMatrix();
    updateRhythmControl(document.querySelector(".mode-button.active")?.textContent.trim());
  </script>
</body>
</html>
